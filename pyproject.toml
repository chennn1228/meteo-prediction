[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwp-postprocessing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyarrow",
  "pvlib",
  "matplotlib",
  "PyYAML",
  "shapely",
]

[project.optional-dependencies]
cpu = ["scikit-learn", "lightgbm", "xgboost", "shap"]
deep = ["torch"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nwp*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
