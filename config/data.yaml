version: openmeteo_point_15var_archive_aligned_2024_02_2026_08
forecast:
  provider: Open-Meteo Previous Runs API
  model: gfs_seamless
  product_class: location_specific
  lead_semantics: retained_previous_run_offset_not_verified_native_initialization
  cell_selection: land
  source_grid_id_exposed: false
  resolution: hourly
  leads: [24, 48, 72]
  variables: [shortwave_radiation, diffuse_radiation, direct_normal_irradiance, global_tilted_irradiance, cloud_cover, temperature_2m, relative_humidity_2m, dewpoint_2m, wind_speed_10m, wind_direction_10m, surface_pressure, precipitation, sunshine_duration, terrestrial_radiation, is_day]
truth:
  primary:
    provider: jma_jaxa_himawari_shortwave_radiation
    model: jma_jaxa_himawari
    role: satellite_derived_ghi_reference
    semantics: preceding_hour_mean
    variables: [shortwave_radiation]
radiation_semantics: preceding_hour_mean
requested_coordinates_role: provenance_only
timezone: UTC
tilt: 30
azimuth: 0
storage:
  raw_partitioning: [source, site, month]
  clean_partitioning: [clean_hash, site, month]
  feature_partitioning: [feature_hash, site, month]
  raw_overwrite_forbidden: true
receipt_required: true
clean_contract:
  radiation_negative_policy: clip_to_zero
  cloud_range: [0, 100]
  missing_policy: preserve_and_report
  row_unit: site_target_time_lead
