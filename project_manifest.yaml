protocol_version: "2.1.0-provisional-15var-archive-aligned"
data_version: "openmeteo-point-15var-archive-aligned-2024-02_2026-08-v1"
data_layout:
  root: data/protocol15temp
  policy: preserve_legacy_raw_and_rebuild_with_sidecars
feature_version: "feature-mechanism-raw-ratios-v2-pending-retrain"
benchmark_version: "nested-purged-rolling-v1-pending"
schema_version: "1.0.0"
primary_target: ghi
primary_task: "GFS GHI probabilistic post-processing"
status: provisional
implementation_levels: [prototype, validated]
execution_levels: [smoke, development, official]
official_gate:
  required_implementation_level: validated
  required_execution_level: official
  legacy_imports_forbidden: true
  official_run_requires_validation_pass: true
cpu_experiment:
  cohort: configured_20_sites_with_returned_service_coordinates
  spatial_generalization: deferred
  forecast_variable_count: 15
  variable_scope: official_previous_runs_archive_availability
  model_ids: [climatology, persistence, smart_persistence, optimal_convex, raw_gfs,
              bias_correction, linear_mos, ridge_mos, lgbm, xgboost]
  readiness_scope: declared_cpu_models_only
daylight_definition:
  formal: solar_elevation_gt_0
  sensitivity_only: [solar_elevation_gt_10, is_day_fcst_eq_1]
weather_diagnostics:
  legacy_kt_bins: [0.44, 0.73, 0.97]
  role: diagnostic_only_not_model_selection

scientific_argument:
  claim: >-
    In Jiangsu, the project will quantify the independent value of D+1/D+2/D+3
    GFS GHI and the incremental value of increasingly complex post-processing.
  evidence_status: >-
    Existing month-balanced results are diagnostic only; official evidence must
    be regenerated under the nested purged rolling-origin protocol.
  boundary: >-
    Conclusions apply to the Open-Meteo location-specific GFS product and cannot
    be generalized to raw GFS GRIB cells until a separate raw-grid audit is run.

development_period:
  start: "2024-02-01T00:00:00Z"
  end: "2025-08-31T23:59:59Z"
test_period:
  start: "2025-09-01T00:00:00Z"
  end: "2026-08-31T23:59:59Z"

data_sources:
  forecast:
    provider: Open-Meteo Previous Runs API
    model: gfs_seamless
    product_class: location_specific
    cell_selection: land
    leads_hours: [24, 48, 72]
    temporal_resolution: hourly
    radiation_semantics: preceding_hour_mean
    source_grid_id_exposed: false
  truth:
    primary: jma_jaxa_himawari_shortwave_radiation
    primary_semantics: preceding_hour_mean
    cloud_reference: era5_reanalysis
    cloud_reference_role: supplementary_exploratory

validation_protocol:
  name: nested_purged_rolling_origin
  maximum_sequence_lookback_hours: 168
  maximum_lead_hours: 72
  purge_hours: 240
  purge_derivation: maximum_sequence_lookback_hours + maximum_lead_hours
  gap_sensitivity_days: [7, 10, 14]
  inner_folds_per_outer: 3
  inner_early_stop_days: 14
  inner_scoring_days: 14
  inner_order: [fit, purge, early_stop, purge, score]
  first_outer_insufficiency_policy: report_and_block_no_silent_window_change
  outer_folds:
    - {id: outer_1, train_start: "2024-02-01", train_end: "2024-05-31", purge_start: "2024-06-01", purge_end: "2024-06-10", validation_start: "2024-06-11", validation_end: "2024-07-31"}
    - {id: outer_2, train_start: "2024-02-01", train_end: "2024-08-31", purge_start: "2024-09-01", purge_end: "2024-09-10", validation_start: "2024-09-11", validation_end: "2024-10-31"}
    - {id: outer_3, train_start: "2024-02-01", train_end: "2024-11-30", purge_start: "2024-12-01", purge_end: "2024-12-10", validation_start: "2024-12-11", validation_end: "2025-01-31"}
    - {id: outer_4, train_start: "2024-02-01", train_end: "2025-02-28", purge_start: "2025-03-01", purge_end: "2025-03-10", validation_start: "2025-03-11", validation_end: "2025-04-30"}
    - {id: outer_5, train_start: "2024-02-01", train_end: "2025-05-31", purge_start: "2025-06-01", purge_end: "2025-06-10", validation_start: "2025-06-11", validation_end: "2025-07-31"}
  final_fit:
    fit_end: "2025-06-20"
    early_stop_start: "2025-07-01"
    early_stop_end: "2025-07-31"
    calibration_start: "2025-08-11"
    calibration_end: "2025-08-31"

quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
selection_metric: mean_pinball
report_metrics: [mae, rmse, bias, r2, rmse_skill, mean_pinball, coverage, interval_width]
point_metric_references:
  climatology: null
  raw_gfs: climatology
  other_fixed: climatology
  corrected: raw_gfs
probability_construction:
  ridge_mos: early_stop_residual_distribution_uncalibrated
  posthoc_calibration: independent_later_calibration_block

feature_groups:
  radiation: [ghi_fcst, dhi_fcst, dni_fcst, gti_fcst, terrestrial_fcst]
  clear_sky_kt: [ghi_clear_sky, dni_clear_sky, kt_model, kni_model, ghi_fcst_minus_clear, diffuse_fraction_model]
  cloud: [cloud_cover_fcst, cloud_cover_change, cloud_cover_roll1, cloud_cover_roll3]
  meteorology: [temp_fcst, rh_fcst, dewpoint_fcst, wind_speed_fcst, wind_dir_sin, wind_dir_cos, pressure_fcst, precip_fcst, sunshine_fcst]
  solar_geometry: [solar_elevation, solar_azimuth_sin, solar_azimuth_cos]
  temporal_dynamics: [hour_local_sin, hour_local_cos, doy_sin, doy_cos, month_sin, month_cos, ghi_fcst_lag1, ghi_fcst_lag2, lead_time]
  spatial_static: [source_grid_latitude, source_grid_longitude, source_grid_elevation]
  selection_evidence: [group_ablation, grouped_permutation_importance, rolling_fold_stability, confidence_interval]
  shap_role: interpretation_only

feature_policy:
  issue_time_availability_required: true
  identity_fields_forbidden: [station_id, location_id, source_grid_id]
  truth_fields_forbidden: [ghi_obs_sat, ghi_obs_era5, cloud_cover_obs]
  location_for_solar_geometry: gfs_service_coordinates
  solar_geometry_time_basis: preceding_hour_interval_midpoint
  clear_sky_time_basis: preceding_hour_mean_12x5min_midpoints
  circular_encodings: [wind_direction, solar_azimuth, hour_local, day_of_year, month]
  clear_sky_denominator_min_wm2: 50
  diffuse_denominator_min_wm2: 50
  diagnostic_ratio_columns: [kt_raw, kni_raw, diffuse_fraction_raw]
  diagnostic_ratio_clipping: forbidden
  model_ratio_columns: [kt_model, kni_model, diffuse_fraction_model]
  model_ratio_transform: identity_pending_fold_fitted_justification
  fit_preprocessing_on: current_training_fold_only
  lag_source: prior_available_forecasts_by_issue_time
  cloud_imputation_predictors: [ghi_fcst, temp_fcst, rh_fcst, pressure_fcst]

spatial_design:
  execution_status: deferred_by_user
  training_sites: 20
  province_model_forbids_station_id: true
  level_1: stratified_spatial_holdout
  level_2: province_wide_unseen_grid
  level_3: regional_extrapolation_stress_test
  training_site_density: [5, 10, 15, 20]
  truth_gate: reliable_hourly_himawari_required
  study_object: open_meteo_returned_service_points
  service_registry_status: empirical_probe_not_frozen
  empirical_probe_step_degrees: 0.05
  empirical_probe_returned_distinct_count: 707
  empirical_probe_returned_inside_jiangsu_count: 654
  empirical_probe_returned_outside_jiangsu_count: 53
  convergence_required_before_official: true
  density_selection: deterministic_region_balanced_farthest_point
  density_region_quotas: {5: 1, 10: 2, 15: 3, 20: 4}
  requested_coordinates_role: provenance_only

models:
  - {id: climatology, family: baseline, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: persistence, family: baseline, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: smart_persistence, family: baseline, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: optimal_convex, family: baseline, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: raw_gfs, family: raw, role: value_ladder, implementation_status: validated, official_eligible: true, tuning_required: false, execution_device: cpu}
  - {id: bias_correction, family: statistical, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: linear_mos, family: statistical, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: false, execution_device: cpu}
  - {id: ridge_mos, family: statistical, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: cpu}
  - {id: lgbm, family: tree_ml, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: cpu}
  - {id: xgboost, family: tree_ml, role: value_ladder, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: cpu}
