  - {id: cnn, family: deep, internal_version: v3, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: tcn, family: deep, internal_version: v4, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: lstm, family: deep, internal_version: v5, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: transformer, family: deep, internal_version: v6, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: autoformer, family: deep, internal_version: v7, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: informer, family: deep, internal_version: v8, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: fedformer, family: deep, internal_version: v9, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: itransformer, family: deep, internal_version: v10, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: patchtst, family: deep, internal_version: v11, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: dlinear, family: deep, internal_version: v12, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: timesnet, family: deep, internal_version: v13, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: tsmixer, family: deep, internal_version: v14, implementation_status: pending_validation, official_eligible: false, tuning_required: true, execution_device: gpu}
  - {id: pinn, family: experimental_constrained, internal_version: v15, implementation_status: experimental, official_eligible: false, tuning_required: false, execution_device: gpu}
model_count: 24
deep_model_count: 14

tuning_budget:
  policy: equal_budget
  trials_per_model: 6
  tuning_seed: 0
  common_inner_folds: 3
  learning_rates: [0.0005, 0.001]
  model_scales: [small, base]
  dropout: [0.1, 0.2]
  final_seed_policy: {candidate_seed: 0, top_models_seeds: [0, 1, 2, 3, 4]}
  report_compute_budget: true
  trial_definition: distinct_preregistered_hyperparameter_candidate
  objective: mean_pinball
  outer_validation_forbidden_during_selection: true
  final_test_forbidden_during_selection: true

tuning_search_spaces:
  ridge_mos:
    - {alpha: 0.00001}
    - {alpha: 0.001}
    - {alpha: 0.1}
    - {alpha: 1.0}
    - {alpha: 10.0}
    - {alpha: 1000.0}
  lgbm:
    - {learning_rate: 0.05, num_leaves: 31, max_depth: -1, subsample: 0.9, colsample_bytree: 0.9}
    - {learning_rate: 0.05, num_leaves: 63, max_depth: 8, subsample: 0.8, colsample_bytree: 0.8}
    - {learning_rate: 0.1, num_leaves: 31, max_depth: 8, subsample: 0.9, colsample_bytree: 0.8}
    - {learning_rate: 0.1, num_leaves: 63, max_depth: -1, subsample: 0.8, colsample_bytree: 0.9}
    - {learning_rate: 0.05, num_leaves: 127, max_depth: 12, subsample: 0.7, colsample_bytree: 0.7}
    - {learning_rate: 0.03, num_leaves: 63, max_depth: 10, subsample: 0.9, colsample_bytree: 0.9}
  xgboost:
    - {learning_rate: 0.05, max_depth: 6, subsample: 0.9, colsample_bytree: 0.9}
    - {learning_rate: 0.1, max_depth: 6, subsample: 0.8, colsample_bytree: 0.8}
    - {learning_rate: 0.05, max_depth: 8, subsample: 0.8, colsample_bytree: 0.7}
    - {learning_rate: 0.1, max_depth: 8, subsample: 0.9, colsample_bytree: 0.8}
    - {learning_rate: 0.08, max_depth: 7, subsample: 0.85, colsample_bytree: 0.8}
    - {learning_rate: 0.03, max_depth: 5, subsample: 0.9, colsample_bytree: 0.9}
  deep_shared_prototype:
    - {learning_rate: 0.0005, model_scale: small, dropout: 0.1}
    - {learning_rate: 0.001, model_scale: small, dropout: 0.1}
    - {learning_rate: 0.0005, model_scale: base, dropout: 0.1}
    - {learning_rate: 0.001, model_scale: base, dropout: 0.1}
    - {learning_rate: 0.0005, model_scale: small, dropout: 0.2}
    - {learning_rate: 0.001, model_scale: base, dropout: 0.2}

seed_policy:
  tuning_seed: 0
  candidate_seed: 0
  final_top_model_seeds: [0, 1, 2, 3, 4]
  current_legacy_result_seed_coverage: incomplete

calibration_method:
  primary: time_ordered_split_conformal
  additive_quantile_residual: "residual = y - q_hat; delta_tau = quantile(residual, tau); q_cal = q_hat + delta_tau"
  uncertainty: block_bootstrap
  conditional_candidate: mondrian_by_weather
  chronology: [fit, early_stop, later_calibration, final_test]
  bootstrap_block_unit: actual_time_day

prediction_contract:
  quantile_columns: [q0.05, q0.10, q0.25, q0.50, q0.75, q0.90, q0.95]
  point_only_model: raw_gfs
  identity_fields: [location_id, requested_coordinates, gfs_service_coordinates, truth_service_coordinates]
  temporal_fields: [target_time_utc, forecast_issue_time_utc, lead_time]
  provenance_fields: [model_id, implementation_level, execution_level, outer_fold, inner_fold, seed, data_version, feature_version, protocol_revision, experiment_id, result_status]
  probabilistic_selection_metric: mean_pinball
  crps_q7_trunc_label: seven_quantile_interval_truncated_crps_approximation

pinn:
  status: experimental_constrained_model
  nonnegative_constraint: soft
  clear_sky_upper_bound: disabled_pending_site_adaptation
  kt_consistency_implemented: false

official_result_set: null
provisional_result_sets:
  - {id: legacy_month_balanced_full, reason: old_noncausal_model_selection_protocol}
  - {id: fixed_kt_robustness, reason: partial_model_subset_only}
